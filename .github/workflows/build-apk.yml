# Compila o APK automaticamente na nuvem (GitHub Actions).
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Testes unitários
        run: gradle test
      - name: Gerar APK debug
        run: gradle assembleDebug
      - name: Calcular SHA-256 do APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
