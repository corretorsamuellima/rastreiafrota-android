# Compila o APK automaticamente na nuvem (GitHub Actions).
# Como usar: crie um repositório no GitHub com o CONTEÚDO da pasta android-app
# na raiz, e este arquivo em .github/workflows/. A cada push, o APK é gerado
# e fica disponível em Actions → (execução) → Artifacts → app-debug.
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rastreiafrota-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Testes unitários
        run: gradle test

      - name: Gerar APK debug
        run: gradle assembleDebug
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}

      - name: Calcular SHA-256 do APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: RastreiaFrota-1.4.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
